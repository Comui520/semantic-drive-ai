<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1f3a"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <!-- Folder gradient -->
    <linearGradient id="folder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0098cc"/>
    </linearGradient>
    <!-- Folder flap gradient -->
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e6a0"/>
      <stop offset="100%" stop-color="#00c488"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Subtle glow for AI elements -->
    <filter id="glow-subtle" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="1024" height="1024" rx="216" ry="216" fill="url(#bg)"/>

  <!-- Outer ring -->
  <rect x="32" y="32" width="960" height="960" rx="192" ry="192" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.15"/>

  <!-- Folder body -->
  <g filter="url(#glow)">
    <!-- Folder flap -->
    <path d="M 240,340 L 240,280 Q 240,240 280,240 L 440,240 Q 460,240 480,260 L 540,320 Q 550,330 560,330 L 760,330 Q 800,330 800,370 L 800,400 L 240,400 Z" fill="url(#flap)" opacity="0.9"/>
    <!-- Folder main body -->
    <path d="M 200,400 L 824,400 Q 840,400 840,416 L 840,720 Q 840,760 800,760 L 224,760 Q 184,760 184,720 L 184,416 Q 184,400 200,400 Z" fill="url(#folder)" opacity="0.92"/>
  </g>

  <!-- Folder inner highlight -->
  <path d="M 200,400 L 824,400 L 824,420 Q 824,424 820,424 L 204,424 Q 200,424 200,420 Z" fill="#ffffff" opacity="0.15"/>

  <!-- AI Neural network nodes -->
  <g filter="url(#glow-subtle)" opacity="0.9">
    <!-- Connection lines -->
    <line x1="460" y1="500" x2="560" y2="560" stroke="#00e6a0" stroke-width="3" opacity="0.5"/>
    <line x1="560" y1="560" x2="660" y2="500" stroke="#00e6a0" stroke-width="3" opacity="0.5"/>
    <line x1="460" y1="500" x2="460" y2="630" stroke="#00e6a0" stroke-width="3" opacity="0.4"/>
    <line x1="660" y1="500" x2="660" y2="630" stroke="#00e6a0" stroke-width="3" opacity="0.4"/>
    <line x1="460" y1="630" x2="560" y2="560" stroke="#00e6a0" stroke-width="3" opacity="0.35"/>
    <line x1="660" y1="630" x2="560" y2="560" stroke="#00e6a0" stroke-width="3" opacity="0.35"/>
    <line x1="460" y1="630" x2="660" y2="630" stroke="#00e6a0" stroke-width="3" opacity="0.3"/>

    <!-- Nodes -->
    <circle cx="460" cy="500" r="16" fill="#00d4ff" opacity="0.95"/>
    <circle cx="560" cy="560" r="20" fill="#00e6a0" opacity="0.95"/>
    <circle cx="660" cy="500" r="16" fill="#00d4ff" opacity="0.95"/>
    <circle cx="460" cy="630" r="14" fill="#00e6a0" opacity="0.85"/>
    <circle cx="660" cy="630" r="14" fill="#00e6a0" opacity="0.85"/>

    <!-- Node highlights -->
    <circle cx="458" cy="498" r="5" fill="#ffffff" opacity="0.5"/>
    <circle cx="558" cy="558" r="6" fill="#ffffff" opacity="0.5"/>
    <circle cx="658" cy="498" r="5" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- Sparkle accent -->
  <g filter="url(#glow-subtle)">
    <path d="M 720,340 L 730,360 L 750,365 L 730,370 L 720,390 L 710,370 L 690,365 L 710,360 Z" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Bottom highlight -->
  <ellipse cx="512" cy="840" rx="320" ry="12" fill="#00d4ff" opacity="0.06"/>
</svg>
