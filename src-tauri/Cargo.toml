[package]
name = "semantic-drive-ai"
version = "0.2.0"
description = "API-first cross-platform AI file manager"
authors = ["Semantic Drive AI Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
walkdir = "2"
notify = { version = "7", features = ["macos_kqueue"] }
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
mime_guess = "2"
humansize = "2"
tokio = { version = "1", features = ["full"] }
regex = "1"
zip = "2"
quick-xml = { version = "0.37", features = ["serialize"] }
calamine = "0.26"
lopdf = "0.34"
# OpenAI-compatible cloud APIs, compiled with rustls for portable TLS.
ureq = { version = "3", features = ["rustls"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
byteorder = "1.5"
open = "5"
rayon = "1"
